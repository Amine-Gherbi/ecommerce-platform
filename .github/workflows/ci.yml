name: CI

# Mirrors `npm run verify` exactly. The repository has no remote, so this
# workflow has never executed; docs/PIPELINE.md says so instead of implying a
# green run. Actions are pinned to full commit SHAs; Dependabot keeps them
# current through the `github-actions` ecosystem.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Deny by default; the single job grants only what it needs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shop_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shop_dev?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shop_test?schema=public
      AUTH_SECRET: ci-only-secret-not-for-production
      CI: "true"

    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use Node 22
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.4
        with:
          node-version: 22
          cache: npm

      - name: Create the test database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE shop_test;'

      - name: Install dependencies from the lockfile
        run: npm ci

      # The drift check compares shop_dev against the schema, so the dev
      # database needs the committed migrations. shop_test is built by the
      # Playwright global setup (`db push` + seed 42), not here.
      - name: Apply the committed migrations to the dev database
        run: npx prisma migrate deploy

      - name: Install the Playwright Chromium build
        run: npx playwright install --with-deps chromium

      # Vitest's integration suites reset and truncate `shop_test` before the
      # Playwright global setup ever runs, so the schema has to exist first.
      # `shop_test` carries no migration history by design; `db push` is how the
      # local gate builds it too.
      - name: Build the test database schema
        run: DATABASE_URL="$TEST_DATABASE_URL" npx prisma db push --skip-generate

      # One step, exactly the local gate. No continue-on-error, no `|| true`:
      # lint, types, Vitest with coverage, migration drift and Playwright E2E.
      - name: Verify
        run: npm run verify
